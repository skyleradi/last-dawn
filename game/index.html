<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Last Dawn — Hold the Kingdom</title>
<style>
:root{box-sizing:border-box;--bg:#0b1410;--fg:#fff;--panel:rgba(0,0,0,.66);--gold:#f2b84b;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.p{position:fixed;background:var(--panel);padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.45;pointer-events:none;backdrop-filter:blur(6px)}
#hud{left:calc(6px + var(--safeL));top:calc(6px + var(--safeT));font-size:12px;max-width:56vw}
#obj{left:50%;top:calc(6px + var(--safeT));transform:translateX(-50%);text-align:center;font-size:12.5px;max-width:52vw;background:rgba(0,0,0,.5)}
#help{left:calc(6px + var(--safeL));bottom:calc(6px + var(--safeB));font-size:11px;max-width:44vw;opacity:.85}
#msg,#hint{left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s;font-size:14px;text-align:center;max-width:80vw}
#msg{bottom:calc(150px + var(--safeB))}
#hint{bottom:calc(112px + var(--safeB));background:rgba(0,0,0,.72)}
#mm{position:fixed;right:calc(6px + var(--safeR));bottom:calc(150px + var(--safeB));border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.35);pointer-events:none}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(255,0,0,.8);opacity:0;transition:opacity .1s}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.8);padding:14px;z-index:60;overflow:auto}
.card{max-width:600px;width:100%;padding:20px 22px;background:rgba(15,25,35,.96);border-radius:16px;text-align:center;line-height:1.55;border:1px solid rgba(242,184,75,.25)}
.card h1{margin:0;font-size:26px;letter-spacing:.5px}
.card h2{margin:4px 0 10px;font-weight:400;color:var(--gold);font-size:15px}
.card small{display:block;opacity:.88;margin:9px 0;font-size:12.5px;text-align:left}
button{font-size:17px;padding:12px 28px;border:0;border-radius:10px;background:var(--gold);color:#222;cursor:pointer;margin-top:10px;font-weight:600}
.tab{display:inline-block;padding:6px 11px;margin:0 3px 6px 0;border-radius:8px;background:#2b3242;cursor:pointer;font-size:12px;touch-action:manipulation;user-select:none}
.tab.on{background:var(--gold);color:#222;font-weight:600}
.it{padding:6px 8px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.07);cursor:pointer;opacity:.5;font-size:12.5px;touch-action:manipulation;user-select:none;pointer-events:auto}
.it.ok{opacity:1;background:rgba(80,200,100,.18)}
.it.own{opacity:.32;text-decoration:line-through}
.it.sel{outline:2px solid var(--gold)}
.it.lock{opacity:.4;border-left:3px solid #b04}
.it span{display:block;font-size:11px;opacity:.8;text-decoration:none;margin-top:2px}
/* ===== MOBILE CONTROLS ===== */
#touch{position:fixed;inset:0;pointer-events:none;z-index:40}
#stick{position:absolute;left:calc(14px + var(--safeL));bottom:calc(14px + var(--safeB));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(242,184,75,.8);box-shadow:0 0 14px rgba(242,184,75,.5);transition:transform .05s}
#btns{position:absolute;right:calc(12px + var(--safeR));bottom:calc(14px + var(--safeB));display:grid;grid-template-columns:repeat(2,64px);gap:9px;pointer-events:auto}
.tb{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;line-height:1.15}
.tb:active,.tb.on{background:rgba(242,184,75,.75);color:#222;border-color:var(--gold)}
.tb b{font-size:19px;display:block}
#bAtk{grid-column:1;grid-row:1}
#bGrab{grid-column:2;grid-row:1}
#bEat{grid-column:1;grid-row:2}
#bMenu{grid-column:2;grid-row:2}
/* ===== SLIDE-UP CRAFT SHEET ===== */
#side{position:fixed;left:0;right:0;bottom:0;max-height:56vh;background:rgba(10,18,26,.97);border-radius:18px 18px 0 0;border-top:2px solid var(--gold);z-index:50;transform:translateY(100%);transition:transform .22s ease-out;display:flex;flex-direction:column;padding-bottom:var(--safeB)}
#side.up{transform:translateY(0)}
/* keep the touch controls usable while crafting: lift them above the sheet */
#side.up ~ #touch #stick{transform:translateY(-46vh) scale(.82)}
#side.up ~ #touch #btns{transform:translateY(-46vh) scale(.82)}
#touch #stick,#touch #btns{transition:transform .22s ease-out}
#grab{height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#grab::after{content:'';width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
#tabs{padding:0 10px 6px;flex:0 0 auto}
#sideScroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 12px;pointer-events:auto;touch-action:pan-y}
#sideHead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;font-size:12px;opacity:.75}
/* desktop / mouse: hide touch layer, dock crafting to the right */
@media (pointer:fine){
 #touch{display:none !important}
 #side{right:8px;left:auto;top:calc(8px + var(--safeT));bottom:auto;width:280px;max-height:calc(100vh - 120px);border-radius:12px;transform:none;display:block}
 #grab{display:none}
 #mm{bottom:calc(24px + var(--safeB))}
 #msg{bottom:44px}#hint{bottom:86px}
 #help{bottom:8px}
}
/* touch device in landscape: keep stick/buttons but shrink them */
@media (pointer:coarse) and (max-height:460px){
 #stick{width:100px;height:100px}
 #knob{width:46px;height:46px;margin:-23px 0 0 -23px}
 .tb{width:54px;height:54px;font-size:10px}
 #btns{grid-template-columns:repeat(2,54px);gap:7px}
 #mm{width:110px;height:110px;bottom:calc(122px + var(--safeB))}
 #msg{bottom:calc(132px + var(--safeB))}#hint{bottom:calc(100px + var(--safeB))}
}
</style></head><body>

  </div>
</div>
<div id="ov"></div>

// ---- medan ----

 return r>78?h+((r-78)/10)**2*3:h};
{const g=new T.PlaneGeometry(260,260,130,130);g.rotateX(-Math.PI/2);const p=g.attributes.position,cl=[];
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),y=H(x,z),r=Math.hypot(x,z);p.setY(i,y);
  const c=new T.Color(r<15?0x8b7d5e:y>9?0x8d8d8d:y<-1.6?0xcbbc7c:0x4d9a45);c.offsetHSL(0,0,R(-.03,.03)+Math.sin(x*.3)*Math.sin(z*.3)*.04);cl.push(c.r,c.g,c.b)}

 if(pine)[0,1.1,2.1].forEach((y,i)=>mk(Co(1.7-i*.4,2,7),0x1d5e2f,0,2.8+y,0,g));else{mk(Sp(1.5),0x2f7d32,0,3.6,0,g);mk(Sp(1),0x3a8f3a,.7,3.2,.4,g)}

{const g=new T.Group();mk(B(3,.9,1.5),0x8a5a2b,0,.45,0,g);mk(B(.9,.5,.6),0x444450,.6,1.15,0,g);mk(B(.5,.3,.4),0x444450,.6,1.5,0,g);

 mk(Cy(.9,1,.15,8),0x777777,0,.07,0,g);const f=new T.Mesh(Co(.4,1,6),new T.MeshBasicMaterial({color:0xffa030}));f.position.y=.8;g.add(f);g.userData.f=f;return g};

function human(o){const g=new T.Group();

   ok('T8 resetTouch zeroes stick',inp.mx===0&&inp.mz===0,'mv='+inp.mx+','+inp.mz);

   /* --- T9: render does not throw with corrupt pending --- */
   let rcrash=false;try{pending=0;render(.016)}catch(e){rcrash=true}
   ok('T9 render survives non-building pending',!rcrash);
   pending=-1;

   /* --- T10: day/night cycle advances --- */
   S.day=1;S.night=0;S.tt=DAY-0.2;update(1);
   ok('T10 night triggers',S.night===1,'night='+S.night+' enemies='+en.length);
  }catch(e){fail++;out.push('FATAL '+e.message+'\n'+e.stack.split('\n').slice(0,3).join('\n'))}
  const summary='SELFTEST '+pass+' passed, '+fail+' failed\n'+out.join('\n');
  console.log(summary);
  document.title=(fail?'FAIL ':'OK ')+pass+'/'+(pass+fail);
  const d=document.createElement('pre');
  d.id='selftest';d.style.cssText='position:fixed;inset:0;z-index:99999;background:#000d;color:'+
   (fail?'#f66':'#6f6')+';font:11px monospace;padding:12px;overflow:auto;white-space:pre-wrap';
  d.textContent=summary;document.body.appendChild(d);
 },1200);
}
